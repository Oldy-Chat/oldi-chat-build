name: Check new Aeza media VPS access
on:
  push:
    branches: [main]
    paths: ['.github/workflows/aeza-access.yml', 'tools/aeza/check_access.py', 'tools/aeza/inspect_media_vps.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inspect only the new media VPS; do not deploy
        env:
          AEZA_SSH_PRIVATE_KEY: ${{ secrets.AEZA_SSH_PRIVATE_KEY }}
          AEZA_SSH_KNOWN_HOSTS: ${{ secrets.AEZA_SSH_KNOWN_HOSTS }}
          AEZA_SSH_USER: ${{ secrets.AEZA_SSH_USER }}
          AEZA_SSH_KEY_PASSPHRASE: ${{ secrets.AEZA_SSH_KEY_PASSPHRASE }}
        run: python3 tools/aeza/check_access.py
