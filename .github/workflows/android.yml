name: Verify Oldi Chat sources
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: oldi-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reject secrets, signing keys and runtime data
        run: python3 tools/check-source-policy.py
  server:
    needs: source-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install -r tools/ci-python-requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Run isolated server integration tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/reports
          python tools/ci-server-tests.py 2>&1 | tee build/reports/server-tests.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-test-report
          path: build/reports/server-tests.txt
          retention-days: 14
  android:
    needs: source-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Check Java audio and YouTube link logic
        run: |
          mkdir -p build/java-checks
          javac -d build/java-checks app/src/main/java/chat/oldy/AudioDsp.java tests/AudioDspCheck.java app/src/main/java/chat/oldy/YouTubeLinkDetector.java tests/YouTubeLinkCheck.java
          java -cp build/java-checks chat.oldy.AudioDspCheck
          java -cp build/java-checks chat.oldy.YouTubeLinkCheck
      - name: Compile Android application and instrumentation sources; run lint
        run: gradle --no-daemon :app:compileReleaseJavaWithJavac :app:compileReleaseAndroidTestJavaWithJavac :app:lintRelease
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-lint-reports
          path: app/build/reports/lint-results-release.*
          if-no-files-found: warn
          retention-days: 14
      - name: Prepare native modules and speech assets for the update
        if: github.event_name != 'pull_request'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          sdkmanager 'ndk;28.2.13676358'
          python3 -m pip install vosk
          python3 tools/prepare-speech.py
          bash tools/prepare-tunnel.sh
          bash tools/prepare-dpi.sh
      - name: Assemble unsigned update for signing on the owner workstation
        if: github.event_name != 'pull_request'
        run: |
          gradle --no-daemon -PoldiUnsigned :app:assembleRelease
          python3 tools/check-native-pages.py app/build/outputs/apk/release/app-release-unsigned.apk
          mkdir -p build/update-candidate
          cp app/build/outputs/apk/release/app-release-unsigned.apk build/update-candidate/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" build/update-candidate/
          git rev-parse HEAD > build/update-candidate/source-commit.txt
          sha256sum build/update-candidate/app-release-unsigned.apk > build/update-candidate/sha256.txt
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: unsigned-update-candidate
          path: build/update-candidate/
          if-no-files-found: error
          retention-days: 7
      - name: Prepare emulator verification build with disposable test signing
        if: github.event_name != 'pull_request'
        run: |
          gradle --no-daemon -PoldiUiTest :app:assembleRelease :app:assembleReleaseAndroidTest
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify the new menus and editor on Android
        if: github.event_name != 'pull_request'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          script: bash tools/ci-android-ui.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-ui-report
          path: build/ui-report/
          retention-days: 14
